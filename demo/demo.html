<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>醫師卡牌 Demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0b1020;--gold:#e8c777}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 30%,#1c2a4d,#070a14 70%);color:#eef;font-family:"WenQuanYi Zen Hei","Noto Sans TC",sans-serif;min-height:100vh;overflow-x:hidden}
.card{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;--c1:#e0405a;--c2:#7a1a2e;position:relative;width:200px;height:290px;border-radius:14px;padding:6px;
 background:linear-gradient(145deg,var(--gold),#7d6430 50%,var(--gold));box-shadow:0 14px 30px #000a;transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .15s;flex:none}
.card .in{position:relative;width:100%;height:100%;border-radius:9px;overflow:hidden;background:linear-gradient(170deg,var(--c1),var(--c2));display:flex;flex-direction:column}
.cost{position:absolute;left:-2px;top:-2px;z-index:5;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7fd0ff,#1b5fc4);border:3px solid var(--gold);display:grid;place-items:center;font-weight:900;font-size:20px;text-shadow:0 2px 3px #000}
.art{height:46%;position:relative;display:grid;place-items:center;overflow:hidden}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#fff6,transparent 60%),repeating-linear-gradient(115deg,#fff1 0 6px,#0000 6px 14px)}
.art .face{font-size:74px;filter:drop-shadow(0 6px 6px #0008);position:relative;transform:translate(calc((var(--mx) - 50%)*.12),calc((var(--my) - 50%)*.08))}
.name{background:linear-gradient(90deg,#0006,#0003,#0006);text-align:center;padding:4px 6px;font-weight:900;font-size:15px;letter-spacing:1px;border-block:1px solid #fff4}
.name small{display:block;font-weight:400;font-size:10px;opacity:.85;letter-spacing:0}
.txt{flex:1;padding:6px 10px;font-size:11.5px;line-height:1.35;background:#0007;margin:6px;border-radius:6px}
.txt b{color:var(--gold)}
.stat{position:absolute;bottom:-4px;z-index:5;width:40px;height:40px;display:grid;place-items:center;font-weight:900;font-size:21px;text-shadow:0 2px 3px #000;border:3px solid var(--gold)}
.atk{left:-4px;background:radial-gradient(circle at 35% 30%,#ffe27a,#c98a0a);border-radius:50%}
.hp{right:-4px;background:radial-gradient(circle at 35% 30%,#ff8a8a,#b01c1c);border-radius:50% 50% 50% 50%/40% 40% 60% 60%}
.holo{position:absolute;inset:0;border-radius:9px;pointer-events:none;mix-blend-mode:color-dodge;opacity:.55;
 background:conic-gradient(from calc(var(--mx)*3.6) at var(--mx) var(--my),#ff5fa2,#ffd95f,#5fb6ff,#fff,#ff5fa2)}
.holo2{position:absolute;inset:0;border-radius:9px;pointer-events:none;mix-blend-mode:overlay;opacity:.9;
 background:linear-gradient(115deg,#0000 calc(var(--mx) - 22%),#fff9 var(--mx),#0000 calc(var(--mx) + 22%)),radial-gradient(circle at var(--mx) var(--my),#fff7,#0000 40%)}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.8;background-image:radial-gradient(#fff 1px,#0000 1.5px),radial-gradient(#cfe8ff 1px,#0000 1.5px);background-size:23px 29px,37px 41px;background-position:calc(var(--mx)*.3) 0,10px calc(var(--my)*.3);mix-blend-mode:screen;-webkit-mask:linear-gradient(115deg,#0000 calc(var(--mx) - 30%),#000 var(--mx),#0000 calc(var(--mx) + 30%))}
.rar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);z-index:4;width:12px;height:12px;rotate:45deg;background:var(--gold)}
.legend .rar{background:#ff9a2f;box-shadow:0 0 10px #ff9a2f}
.dept-card{--c1:#e0405a;--c2:#5a1224}.neuro{--c1:#9a5cf0;--c2:#2b1257}.peds{--c1:#f2b53a;--c2:#7a4b08}.er{--c1:#f2703a;--c2:#6a1c0a}.rad{--c1:#2fc7d9;--c2:#0a4150}.onc{--c1:#4fc27a;--c2:#0b4a28}
/* views */
.view{display:none;padding:24px}.view.on{display:block}
h1{margin:0 0 4px;font-size:22px;color:var(--gold)}p.sub{margin:0 0 18px;color:#9ab;font-size:13px}
.row{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
/* board */
.board{width:1280px;height:800px;margin:auto;position:relative;border-radius:20px;overflow:hidden;
 background:radial-gradient(ellipse at 50% 50%,#2c4a3a 0,#1b2e28 45%,#0e1814 100%);border:10px solid #3a2a1a;box-shadow:inset 0 0 120px #000}
.board::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;background:linear-gradient(90deg,#0000,#e8c77766,#0000)}
.hero{position:absolute;width:130px;height:130px;border-radius:50%;border:6px solid var(--gold);display:grid;place-items:center;font-size:62px;box-shadow:0 0 30px #000a}
.hero.enemy{left:575px;top:16px;background:radial-gradient(circle,#9a5cf0,#2b1257)}.hero.me{left:70px;bottom:40px;background:radial-gradient(circle,#e0405a,#5a1224)}
.hero .hhp{position:absolute;right:-14px;bottom:-6px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#b01c1c);border:4px solid var(--gold);display:grid;place-items:center;font-size:26px;font-weight:900}
.hero .tag{position:absolute;top:-4px;left:50%;transform:translate(-50%,-100%);font-size:13px;white-space:nowrap;background:#000a;padding:2px 10px;border-radius:10px}
.lane{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:20px}
.lane .card{transform:scale(.58);margin:-61px -20px}
.lane.e{top:175px}.lane.m{top:360px}
.lane .card.can::before{content:"";position:absolute;inset:-6px;border-radius:18px;box-shadow:0 0 0 3px #7dff9c,0 0 24px #7dff9c;z-index:-1}
.lane .card.taunt{outline:5px solid #888;outline-offset:2px}
.hand{position:absolute;left:230px;right:230px;bottom:-30px;display:flex;justify-content:center}
.hand .card{margin:0 -22px;transform-origin:50% 140%}
.mana{position:absolute;left:230px;top:700px;z-index:9;display:flex;gap:4px;align-items:center;font-weight:900}
.mana i{width:18px;height:24px;background:linear-gradient(#8fd8ff,#1b6fe0);clip-path:polygon(50% 0,100% 30%,100% 70%,50% 100%,0 70%,0 30%)}.mana i.off{filter:grayscale(1) brightness(.4)}
.deck{position:absolute;right:30px;top:520px;width:90px;height:124px;border-radius:8px;background:linear-gradient(145deg,#5d4a2a,#2b2010);border:3px solid var(--gold);box-shadow:4px 4px 0 #2b2010,8px 8px 0 #1a1408;display:grid;place-items:center;font-size:12px;text-align:center}
.btn{position:absolute;right:24px;top:380px;padding:10px 18px;border-radius:30px;background:linear-gradient(#7dff9c,#1fa84a);color:#04210e;font-weight:900;border:3px solid #e8ffe8;box-shadow:0 0 20px #7dff9c88}
.log{position:absolute;left:24px;top:290px;width:250px;font-size:12px;background:#000a;border-radius:10px;padding:10px;line-height:1.6;border:1px solid #fff3}
.log b{color:var(--gold)}
.fx{position:absolute;left:530px;top:215px;width:220px;height:200px;pointer-events:none;background:radial-gradient(circle,#fff,#7de0ff88 35%,#0000 70%);filter:blur(2px);opacity:.9}
.dmg{position:absolute;font-size:44px;font-weight:900;color:#fff;text-shadow:0 0 0 #000,2px 2px 0 #b01c1c,-2px -2px 0 #b01c1c,2px -2px 0 #b01c1c,-2px 2px 0 #b01c1c}
/* draw */
.pack{display:flex;gap:30px;align-items:center;justify-content:center;margin-top:20px}
.packbox{width:210px;height:300px;border-radius:14px;background:linear-gradient(145deg,#2a3f7a,#0c1430);border:4px solid var(--gold);display:grid;place-items:center;text-align:center;font-size:18px;box-shadow:0 0 40px #5fb6ff55}
.packbox span{font-size:80px;display:block}
.reveal{display:flex;gap:26px;justify-content:center;margin-top:30px}
.flip{transform:scale(1.2)}
.glow{box-shadow:0 0 50px 10px #ff9a2fcc,0 14px 30px #000a !important}
.back .in{background:repeating-conic-gradient(#1a2c5c 0 25%,#12204a 0 50%) 0 0/24px 24px;display:grid;place-items:center;font-size:70px}
.cap{text-align:center;margin-top:14px;color:#9ab;font-size:13px}
</style></head><body>
<script>
const D={
 cardio:{cls:'dept-card',em:'🫀',dept:'心臟內科',name:'示範・王醫師',title:'心律守護者',cost:4,atk:3,hp:5,txt:'<b>戰吼:</b>選擇一個友方隨從,<b>恢復 4 點生命</b>並使其<b>+1 攻擊</b>。<br><i>專長:心律不整、電氣生理</i>',rar:''},
 neuro:{cls:'neuro',em:'🧠',dept:'神經外科',name:'示範・李醫師',title:'顯微刀鋒',cost:6,atk:5,hp:4,txt:'<b>戰吼:</b>對一個敵方隨從造成 <b>3 點精準傷害</b>,<b>不會波及</b>鄰近隨從。<br><i>專長:腦腫瘤、顯微手術</i>',rar:'legend'},
 peds:{cls:'peds',em:'🧸',dept:'小兒部',name:'示範・陳醫師',title:'兒童守護神',cost:2,atk:1,hp:3,txt:'<b>嘲諷。</b>每回合結束時,為你的英雄<b>恢復 2 點生命</b>。<br><i>專長:新生兒、發展遲緩</i>',rar:''},
 er:{cls:'er',em:'🚑',dept:'急診醫學部',name:'示範・張醫師',title:'黃金一小時',cost:3,atk:3,hp:2,txt:'<b>衝鋒。</b><b>抽一張牌。</b>若這是你本回合第一張牌,<b>費用 -1</b>。<br><i>專長:創傷、複合式災難</i>',rar:''},
 rad:{cls:'rad',em:'🩻',dept:'影像醫學部',name:'示範・林醫師',title:'透視之眼',cost:3,atk:2,hp:4,txt:'<b>戰吼:</b><b>發現</b>敵方手牌一張牌,並查看其內容。<br><i>專長:神經放射、介入治療</i>',rar:''},
 onc:{cls:'onc',em:'🎗️',dept:'腫瘤醫學部',name:'示範・黃醫師',title:'精準標靶',cost:5,atk:4,hp:4,txt:'<b>亡語:</b>對所有<b>已受傷</b>的敵方隨從造成 <b>2 點傷害</b>。<br><i>專長:肺癌、標靶治療</i>',rar:'legend'}
};
function card(k,o={}){const d=D[k];return `<div class="card ${d.cls} ${d.rar} ${o.cls||''}" style="${o.style||''}"><div class="cost">${d.cost}</div><div class="in"><div class="art"><div class="face">${d.em}</div></div>
<div class="name">${d.name}<small>${d.dept}・${d.title}</small></div><div class="txt">${d.txt}</div><div class="holo"></div><div class="holo2"></div><div class="stars"></div></div>
<div class="stat atk">${d.atk}</div><div class="stat hp">${d.hp}</div><div class="rar"></div></div>`}
const back=`<div class="card back"><div class="in">🩺<div class="holo"></div><div class="holo2"></div></div></div>`;
</script>

<div class="view" id="gallery"><h1>① 全息卡片(每張卡的鐳射反光會隨視角移動)</h1><p class="sub">各科別一個主題色;傳說卡有金光與星點。以下人物皆為示範用的虛構醫師,非真實人物。</p><div class="row" id="g"></div></div>

<div class="view" id="boardv"><div class="board" id="b">
 <div class="hero enemy"><span class="tag">對手 · 示範 AI</span>👨‍⚕️<div class="hhp">22</div></div>
 <div class="lane e" id="le"></div><div class="lane m" id="lm"></div>
 <div class="fx"></div><div class="dmg" style="left:620px;top:262px">-3</div>
 <div class="log"><b>戰況</b><br>▸ 王醫師 戰吼:恢復 4 點生命<br>▸ 陳醫師 嘲諷中<br>▸ 李醫師 對 黃醫師 造成 <b>3</b> 傷害<br>▸ 你抽了 1 張牌</div>
 <div class="deck">牌庫<br><b style="font-size:26px">17</b></div><div class="btn">結束回合</div>
 <div class="hero me"><span class="tag">你 · 主治醫師</span>🧑‍⚕️<div class="hhp">27</div></div>
 <div class="hand" id="h"></div>
 <div class="mana"><span style="margin-right:6px">6/8</span><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i></div>
</div></div>

<div class="view" id="drawv"><h1>③ 抽卡:開包 → 翻牌 → 稀有度光效</h1><p class="sub">抽到傳說醫師時整張卡發出金色光暈。</p>
 <div class="pack"><div class="packbox"><div><span>🩺</span>醫師卡包<br><small style="opacity:.7">NTU 示範版</small></div></div><div style="font-size:50px">➜</div>
 <div class="reveal" id="r" style="margin:0"></div></div><div class="cap">點擊卡片可翻開 · 滑鼠移動會讓鐳射光跟著動</div></div>

<script>
const q=new URLSearchParams(location.search),v=q.get('v')||'gallery';document.getElementById(v==='board'?'boardv':v==='draw'?'drawv':'gallery').classList.add('on');
const H=(m)=>`--mx:${m[0]}%;--my:${m[1]}%;--ry:${(m[0]-50)*.3}deg;--rx:${(50-m[1])*.25}deg`;
const ks=Object.keys(D);const pos=[[25,30],[70,40],[45,70],[30,60],[80,25],[55,45]];
document.getElementById('g').innerHTML=ks.map((k,i)=>card(k,{style:H(pos[i])+';transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry)) scale(1.18);margin:16px'})).join('');
document.getElementById('le').innerHTML=card('peds',{cls:'taunt',style:H([40,40])})+card('onc',{style:H([60,50])})+card('rad',{style:H([30,50])});
document.getElementById('lm').innerHTML=card('cardio',{cls:'can',style:H([55,40])})+card('neuro',{cls:'can',style:H([35,60])})+card('er',{cls:'can',style:H([70,30])});
const hand=['rad','onc','er','cardio','peds'];document.getElementById('h').innerHTML=hand.map((k,i)=>card(k,{style:H([20+i*14,40])+`;transform:perspective(800px) rotateZ(${(i-2)*6}deg) translateY(${Math.abs(i-2)*14}px) scale(.74)`})).join('');
document.getElementById('r').innerHTML=card('er',{style:H([30,40])})+card('onc',{cls:'glow',style:H([62,35])+';transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry)) scale(1.2)'})+back;
document.querySelectorAll('.card').forEach(c=>{c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;c.style.cssText+=`;--mx:${x}%;--my:${y}%;--ry:${(x-50)*.3}deg;--rx:${(50-y)*.25}deg`})});
</script></body></html>
