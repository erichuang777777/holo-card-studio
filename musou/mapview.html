<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>場景導覽</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; color: #f3ead8;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); }
  .bar button, select { font: inherit; border: 1px solid #ffffff33; background: #0d1014cc; color: #f3ead8; padding: 8px 14px; border-radius: 18px; cursor: pointer; }
  .bar button[aria-pressed=true] { background: #1f9c95; color: #fff; }
  .title { position: fixed; left: 20px; top: 16px; background: #0d1014cc; padding: 10px 16px; border-radius: 10px; border-left: 4px solid #1f9c95; }
  .title b { font-size: 22px; letter-spacing: 3px; } .title div { font-size: 13px; color: #b8c4c8; margin-top: 4px; }
  .hint { position: fixed; right: 18px; top: 16px; font-size: 13px; color: #b8c4c8; background: #0d1014aa; padding: 4px 10px; border-radius: 12px; }
</style>
</head>
<body>
<canvas id="c" aria-label="可自由移動鏡頭的場景導覽"></canvas>
<div class="title"><b id="name"></b><div id="zone"></div></div>
<div class="hint">拖曳旋轉・滾輪或雙指縮放・WASD 移動</div>
<div class="bar" id="bar"></div>
<script type="module" src="./src/mapview.js"></script>
</body>
</html>
